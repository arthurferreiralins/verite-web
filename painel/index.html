<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Painel Administrativo — VERITÉ</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png"/>
<link rel="stylesheet" href="/painel/assets/css/admin.css"/>
</head>
<!--
  Esta pagina e SO a tela de login, e e a unica parte do painel que qualquer
  visitante consegue baixar. O HTML do dashboard (Produtos, Pedidos, Clientes,
  Financeiro, Estoque, Clube...) mora em api/_private/dashboard.html, fora do
  diretorio publicado, e so e entregue por api/painel.js depois que
  requireAdminSession() valida o cookie de sessao no servidor.

  Antes, o arquivo unico trazia o dashboard inteiro escondido atras de
  `hidden` — qualquer pessoa via a estrutura completa do sistema no
  "ver codigo-fonte". Os dados nunca vazaram (as 31 rotas /api/admin/*
  exigem sessao e devolvem 401), mas a planta do painel, sim.
-->
<body>

<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <img src="/assets/img/verite-emblem.webp" alt=""/>
      <span>VERITÉ</span>
    </div>
    <p class="login-sub">Painel Administrativo</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-email">Usuário</label>
        <input id="login-email" name="email" type="text" autocomplete="username" required/>
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <div class="password-field">
          <input id="login-password" name="password" type="password" autocomplete="current-password" required/>
          <button type="button" id="login-password-toggle" class="password-toggle" aria-label="Mostrar senha">Mostrar</button>
        </div>
      </div>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn-primary btn-block">
        <span class="btn-label">Entrar</span>
        <span class="spinner" aria-hidden="true" hidden></span>
      </button>
      <p class="login-forgot">Esqueceu a senha? Fale com quem administra o acesso da VERITÉ para redefini-la.</p>
    </form>
  </div>
</div>

<script>
/* Script proprio e minimo: o admin.js (161KB) so e carregado pelo dashboard,
   depois do login. Aqui basta autenticar e redirecionar. */
(function(){
  'use strict';
  var form = document.getElementById('login-form');
  var erro = document.getElementById('login-error');
  var btn = form.querySelector('button[type="submit"]');
  var pwInput = document.getElementById('login-password');
  var pwToggle = document.getElementById('login-password-toggle');

  pwToggle.addEventListener('click', function(){
    var mostrar = pwInput.type === 'password';
    pwInput.type = mostrar ? 'text' : 'password';
    pwToggle.textContent = mostrar ? 'Ocultar' : 'Mostrar';
    pwInput.focus();
  });

  function carregando(estado){
    btn.disabled = estado;
    var label = btn.querySelector('.btn-label');
    var spinner = btn.querySelector('.spinner');
    if(label) label.style.visibility = estado ? 'hidden' : '';
    if(spinner) spinner.hidden = !estado;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    erro.hidden = true;
    carregando(true);
    fetch('/api/admin/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: pwInput.value
      })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){
        if(!r.ok || data.ok === false){
          var err = new Error(data.error || 'Não foi possível entrar.');
          err.status = r.status;
          throw err;
        }
        return data;
      });
    }).then(function(){
      /* o cookie de sessao ja veio no Set-Cookie; /painel/app agora passa
         pela funcao de gate e devolve o dashboard */
      window.location.href = '/painel/app';
    }).catch(function(err){
      erro.textContent = err.message || 'Não foi possível entrar.';
      erro.hidden = false;
      carregando(false);
    });
  });

  /* quem ja tem sessao valida nao precisa ver o formulario de novo */
  fetch('/api/admin/me', { credentials: 'same-origin' }).then(function(r){
    if(r.ok) window.location.replace('/painel/app');
  }).catch(function(){ /* sem sessao: fica no login mesmo */ });
})();
</script>
</body>
</html>
